name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      allow_http:
        description: Run HTTP checks in M3 verification jobs
        required: false
        type: boolean
        default: true

env:
  SUSHI_SKIP_HTTP: ${{inputs.allow_http && '0' || '1' }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore Sushi.sln

      - name: Run test suite
        run: dotnet run --project src/Sushi.Tests/Sushi.Tests.csproj --framework net9.0 --no-restore

  package-smoke:
    name: Linux package smoke test
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Build packaged executable
        run: bash scripts/build.sh linux-x64

      - name: Verify packaged executable
        run: |
          test -f publish/Sushi-linux_x64-64
          publish/Sushi-linux_x64-64 --help >/dev/null
          publish/Sushi-linux_x64-64 check examples/m3_verification.sushi --target bash-linux --format json >/dev/null
          publish/Sushi-linux_x64-64 benchmark --targets bash --iterations 1 --warmup 0 --strict-output --filter regex_match --output-dir /tmp/sushi-package-smoke

  m3-verification-bash:
    name: M3 Verification (Bash)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore src/Sushi/Sushi.csproj

      - name: Install Bash runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Transpile M3 verification to Bash
        run: dotnet run --project src/Sushi --no-restore -- transpile examples/m3_verification.sushi -t bash-linux

      - name: Execute Bash verification
        run: bash examples/m3_verification.bash-linux.sh

  m3-verification-zsh:
    name: M3 Verification (Zsh)
    runs-on: macos-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore src/Sushi/Sushi.csproj

      - name: Transpile M3 verification to Zsh
        run: dotnet run --project src/Sushi --no-restore -- transpile examples/m3_verification.sushi -t zsh-macos

      - name: Execute Zsh verification
        run: zsh examples/m3_verification.zsh-macos.zsh

  m3-verification-powershell:
    name: M3 Verification (PowerShell)
    runs-on: windows-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore src/Sushi/Sushi.csproj

      - name: Transpile M3 verification to PowerShell
        run: dotnet run --project src/Sushi --no-restore -- transpile examples/m3_verification.sushi -t powershell-windows

      - name: Execute PowerShell verification
        shell: pwsh
        run: |
          ./examples/m3_verification.powershell-windows.ps1
