name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to publish (leave empty for validation)
        required: false
        type: string
      run_benchmark:
        description: Run the full benchmark matrix
        required: false
        default: false
        type: boolean
      allow_http:
        description: Run HTTP checks in M3 verification jobs
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

env:
  SUSHI_SKIP_HTTP: ${{ inputs.allow_http && '0' || '1' }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
      - run: dotnet restore Sushi.sln
      - run: dotnet run --project src/Sushi.Tests/Sushi.Tests.csproj --framework net9.0 --no-restore

  editor-clients:
    name: Editor client builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - working-directory: editors/vscode
        run: npm ci && npm run compile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: editors/jetbrains
        run: gradle buildPlugin

  package-smoke:
    name: Linux package smoke test
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
      - run: bash scripts/build.sh linux-x64
      - run: |
          test -f publish/Sushi-linux_x64-64
          publish/Sushi-linux_x64-64 --help >/dev/null
          publish/Sushi-linux_x64-64 check examples/m3_verification.sushi --target bash-linux --format json >/dev/null
          publish/Sushi-linux_x64-64 benchmark --targets bash --iterations 1 --warmup 0 --strict-output --filter regex_match --output-dir /tmp/sushi-package-smoke

  m3-verification:
    name: M3 Verification (${{ matrix.name }})
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Bash
            os: ubuntu-latest
            target: bash-linux
            command: bash
            output: examples/m3_verification.bash-linux.sh
          - name: Zsh
            os: macos-latest
            target: zsh-macos
            command: zsh
            output: examples/m3_verification.zsh-macos.zsh
          - name: PowerShell
            os: windows-latest
            target: powershell-windows
            command: powershell
            output: examples/m3_verification.powershell-windows.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
      - run: dotnet restore src/Sushi/Sushi.csproj
      - if: matrix.name == 'Bash'
        run: sudo apt-get update && sudo apt-get install -y curl
      - run: dotnet run --project src/Sushi --no-restore -- transpile examples/m3_verification.sushi -t ${{ matrix.target }}
      - if: matrix.name == 'PowerShell'
        shell: powershell
        run: ./examples/m3_verification.powershell-windows.ps1
      - if: matrix.name == 'PowerShell'
        shell: pwsh
        run: ./examples/m3_verification.powershell-windows.ps1
      - if: matrix.name != 'PowerShell'
        run: ${{ matrix.command }} ${{ matrix.output }}

  benchmark:
    name: Benchmark (${{ matrix.target }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_benchmark)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bash
          - os: macos-latest
            target: zsh
          - os: windows-latest
            target: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 9.0.x }
      - run: dotnet restore src/Sushi/Sushi.csproj
      - name: Download prior baseline artifact
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: ci.yml
          branch: ${{ github.ref_name }}
          name: benchmark-${{ matrix.target }}-results
          path: tmp/baseline
          if_no_artifact_found: warn
      - name: Run benchmark suite
        shell: pwsh
        run: |
          $outputDir = "tmp/benchmarks/ci-${{ github.run_id }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $outputDir | Out-Null
          $args = @("run", "--project", "src/Sushi", "--", "benchmark", "--targets", "${{ matrix.target }}", "--iterations", "10", "--warmup", "2", "--output-dir", $outputDir)
          if (Test-Path "tmp/baseline/results.json") { $args += @("--baseline", "tmp/baseline/results.json") }
          dotnet @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OUTPUT_DIR=$outputDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.target }}-results
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error

  release-binaries:
    name: Release binary (${{ matrix.rid }})
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [unit-tests, package-smoke, m3-verification]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: ubuntu-latest
            rid: linux-arm
          - os: macos-13
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-x86
          - os: windows-latest
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 9.0.x }
      - shell: bash
        run: bash scripts/build.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: sushi-${{ matrix.rid }}
          path: publish/Sushi-*
          if-no-files-found: error

  release-tool:
    name: Release .NET tool
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [unit-tests, package-smoke, m3-verification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 9.0.x }
      - shell: bash
        run: |
          tag="${{ inputs.release_tag || github.ref_name }}"
          dotnet pack src/Sushi/Sushi.csproj -c Release -p:Version="${tag#v}" -o artifacts/nuget
      - uses: actions/upload-artifact@v4
        with:
          name: sushi-dotnet-tool
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

  release-editors:
    name: Release editor packages
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [unit-tests, editor-clients, package-smoke, m3-verification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: editors/vscode/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - shell: bash
        run: |
          tag="${{ inputs.release_tag || github.ref_name }}"
          version="${tag#v}"
          (cd editors/vscode && npm ci)
          bash scripts/package-vscode.sh "$version" artifacts/editors
          gradle -p editors/jetbrains -PsushiVersion="$version" buildPlugin
          cp editors/jetbrains/build/distributions/*.zip artifacts/editors/
      - uses: actions/upload-artifact@v4
        with:
          name: sushi-editors
          path: artifacts/editors/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [release-binaries, release-tool, release-editors]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ inputs.release_tag || github.ref_name }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Sushi $tag"
          find artifacts -type f -print0 | xargs -0 gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber
