name: Benchmark

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    name: Benchmark (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bash
          - os: macos-latest
            target: zsh
          - os: windows-latest
            target: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore src/Sushi/Sushi.csproj

      - name: Download prior baseline artifact
        id: baseline
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: benchmark.yml
          branch: ${{ github.ref_name }}
          name: benchmark-${{ matrix.target }}-results
          path: tmp/baseline
          if_no_artifact_found: warn

      - name: Run benchmark suite
        shell: pwsh
        run: |
          $outputDir = "tmp/benchmarks/ci-${{ github.run_id }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $outputDir | Out-Null
          "OUTPUT_DIR=$outputDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $args = @(
            "run", "--project", "src/Sushi", "--",
            "benchmark",
            "--targets", "${{ matrix.target }}",
            "--iterations", "10",
            "--warmup", "2",
            "--output-dir", $outputDir
          )

          if (Test-Path "tmp/baseline/results.json") {
            $args += @("--baseline", "tmp/baseline/results.json")
          }

          dotnet @args
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.target }}-results
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
