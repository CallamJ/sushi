name: Prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: Sushi-linux_x64-64
          - os: macos-13
            rid: osx-x64
            artifact: Sushi-osx_x64-64
          - os: windows-latest
            rid: win-x64
            artifact: Sushi-win_x64-64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build standalone executable
        shell: bash
        run: bash scripts/build.sh "${{ matrix.rid }}"

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: sushi-${{ matrix.rid }}
          path: publish/${{ matrix.artifact }}
          if-no-files-found: error

  dotnet-tool:
    name: Package .NET tool
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Pack tool
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet pack src/Sushi/Sushi.csproj -c Release -p:Version="$version" -o artifacts/nuget

      - name: Upload tool package
        uses: actions/upload-artifact@v4
        with:
          name: sushi-dotnet-tool
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

  release:
    name: Publish GitHub prerelease
    runs-on: ubuntu-latest
    needs: [package, dotnet-tool]
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create prerelease and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --generate-notes
          fi
          find artifacts -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
